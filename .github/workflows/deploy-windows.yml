name: Deploy Flask Website (Windows)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SSM_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy to Windows EC2 via SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0d3ccfdee543b5968" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters 'commands=[
              "cd \"${{ secrets.APP_PATH }}\"",
              "Write-Host \"Current Directory\"",
              "Get-Location",
              "Write-Host \"Pulling latest code...\"",
              "git pull origin main",
              "Write-Host \"Restarting NSSM Service...\"",
              "Restart-Service -Name \"${{ secrets.NSSM_SERVICE_NAME }}\" -Force",
              "Write-Host \"Deployment Completed Successfully.\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d3ccfdee543b5968"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d3ccfdee543b5968" \
            --query "StandardOutputContent" \
            --output text
