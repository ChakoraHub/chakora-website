name: Build ChakoraHub website container

on:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "templates/**"
      - "static/**"
      - "files/**"
      - "images/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - ".github/workflows/build-website-image.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "templates/**"
      - "static/**"
      - "files/**"
      - "images/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - ".github/workflows/build-website-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (pull requests do not publish)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: chakora-website:pr-${{ github.event.pull_request.number }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chakorahub/chakora-website:${{ github.sha }}
            ghcr.io/chakorahub/chakora-website:latest
