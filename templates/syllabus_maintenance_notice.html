{% if maintenance_mode %}
<div class="container mt-3">
    <div class="alert alert-info"
         role="alert"
         id="syllabus-maintenance-notice">

        <strong>Scheduled maintenance notice</strong><br>

        The Syllabus service is currently being updated.
        You may experience a short interruption while the
        service is restarted.

        We apologize for the inconvenience.
        Please refresh the page after the update is completed.

    </div>
</div>
{% endif %}
