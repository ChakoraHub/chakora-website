{% if maintenance_mode %}
<div class="container mt-3" id="openPositionsMaintenanceContainer">
  <div class="alert alert-warning" role="alert"
       id="open-positions-maintenance-notice"
       style="background: linear-gradient(135deg, rgba(254, 243, 199, 0.95), rgba(253, 230, 138, 0.95)); border: 1.5px solid #f59e0b; border-left: 6px solid #d97706; border-radius: 12px; padding: 18px 24px; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.18);">
    <div style="display: flex; align-items: flex-start; gap: 16px;">
      <div style="background: #f59e0b; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 3px 10px rgba(245, 158, 11, 0.35);">
        <i class="fas fa-tools fa-lg"></i>
      </div>
      <div style="flex: 1;">
        <h5 style="color: #92400e; font-weight: 700; margin: 0 0 5px 0; font-size: 1.05rem; letter-spacing: -0.2px;">
          Scheduled Maintenance in Progress
        </h5>
        <p style="color: #78350f; margin: 0; font-size: 0.92rem; line-height: 1.5;">
          <strong>Scheduled maintenance notice</strong><br>
          The Open Positions portal is currently undergoing scheduled platform updates and improvements. Application submissions may be temporarily paused.
        </p>
      </div>
    </div>
  </div>
</div>
{% endif %}
