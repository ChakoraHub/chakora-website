<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<style>
body{
margin:0;
background:linear-gradient(120deg,#eef6fa,#ffffff);
font-family:Arial;
}

.auth-container{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.auth-box{
background:#fff;
width:360px;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.auth-box h3{
text-align:center;
margin-bottom:20px;
color:#0078D7;
}

.auth-box input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

.auth-box button{
width:100%;
margin-top:20px;
padding:12px;
background:#0078D7;
border:none;
border-radius:6px;
color:white;
font-size:15px;
cursor:pointer;
}

.auth-box button:hover{
background:#005a9e;
}
</style>

</head>

<body>

<div class="auth-container">

<div class="auth-box">

<h3>Reset Password</h3>

<form method="POST">

<input name="email" value="{{email}}" readonly>

<input type="password" name="password" placeholder="New Password" required>

<input type="password" name="confirm" placeholder="Confirm Password" required>

<button>Update Password</button>

</form>

</div>
</div>

</body>
</html>
