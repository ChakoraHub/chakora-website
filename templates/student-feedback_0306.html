<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Feedback</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
      background-size: cover;
      background-position: center;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 40px;
      background: rgba(0, 0, 0, 0.4);
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
      box-sizing: border-box;
    }
    header img { height: 90px; }
    .profile-container { position: relative; display: inline-block; margin-right: 30px; cursor: pointer; }
    .profile-pic { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #fff; }
    .dropdown { display: none; position: absolute; left: 0; background-color: #333; min-width: 120px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); border-radius: 5px; z-index: 1; }
    .dropdown a { color: white; padding: 10px; text-decoration: none; display: block; }
    .dropdown a:hover { background-color: #555; }
    .feedback-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding-top: 120px; }
    .feedback-container { background-color: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); width: 90%; max-width: 550px; }
    .feedback-container h2 { margin-top: 0; color: #007acc; font-size: 26px; text-align: center; }
    input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    input[readonly] { background-color: #f3f3f3; }
    textarea { height: 250px; resize: vertical; }
    button { background-color: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; }
    button:hover { background-color: #218838; }
    .thank-you-box { text-align: center; color: green; font-size: 22px; font-weight: bold; }
    .resources-btn { display: block; margin: 20px auto; text-align: center; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; width: fit-content; cursor: pointer; }
    .resources-btn:hover { background-color: #0056b3; }
    .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,0.3); width: 320px; }
    .modal-content h3 { margin-bottom: 20px; color: #3949ab; }
    .modal-actions button { margin: 8px; padding: 8px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .confirm-btn { background: #3949ab; color: white; }
    .cancel-btn { background: #f0f0f0; color: #333; }
    .confirm-btn:hover { background: #303f9f; }
    .cancel-btn:hover { background: #ddd; }
  </style>
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
    <div class="profile-container" onclick="toggleDropdown()">
      <img src="{{ url_for('static', filename=session.get('profile_pic', 'default_profile.jpg')) }}" class="profile-pic" alt="Profile">
      <div class="dropdown" id="dropdownMenu">
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('settings') }}">Settings</a>
        <a href="#" onclick="openModal()">Logout</a>
      </div>
    </div>
  </header>

  <div class="feedback-wrapper">
    <div class="feedback-container">
      {% if feedback_submitted %}
        <div class="thank-you-box">
          ✅ Thank you{% if feedback_name %}, {{ feedback_name }}{% endif %} for your feedback!
        </div>
        <a class="resources-btn" href="{{ url_for('resources') }}">⬅ Back to Resources</a>
      {% else %}
        <h2>Hi, please share your valuable feedback</h2>

        <form method="POST" action="/feedback">
          <label for="name">Name:</label>
          <input type="text" name="name" placeholder="Your Name"
                 value="{{ user.username if user else '' }}"
                 {% if logged_in %}readonly{% endif %} required>

          <label for="email">Email:</label>
          <input type="email" name="email" placeholder="Your Email"
                 value="{{ user['email'] if user else '' }}"
                 {% if logged_in %}readonly{% endif %} required>

          <label for="phone">Phone:</label>
          <input type="tel" name="phone" placeholder="Your Phone"
                 value="{{ user['phone'] if user else '' }}"
                 {% if logged_in %}readonly{% endif %} required>

          <textarea name="feedback" placeholder="Write your feedback here..." required></textarea>
          <button type="submit">Submit</button>
        </form>

        <a class="resources-btn" href="{{ url_for('resources') }}">⬅ Back to Resources</a>
      {% endif %}
    </div>
  </div>

  <!-- Logout Confirmation Modal -->
  <div id="confirmationModal" class="modal">
    <div class="modal-content">
      <h3>Are you sure you want to log out?</h3>
      <div class="modal-actions">
        <button class="confirm-btn" onclick="logout()">Yes</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdownMenu');
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
    document.addEventListener('click', function(event) {
      const dropdown = document.getElementById('dropdownMenu');
      const wrapper = document.querySelector('.profile-container');
      if (!wrapper.contains(event.target)) { dropdown.style.display = 'none'; }
    });
    function openModal() { document.getElementById('confirmationModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('confirmationModal').style.display = 'none'; }
    function logout() { window.location.href = "{{ url_for('logout') }}"; }
  </script>
</body>
</html>
