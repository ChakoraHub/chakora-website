<!-- ==================== AI CHATBOT WIDGET ====================
     Include this snippet at the bottom of ANY HTML page
     Usage: Add this before closing </body> tag
     ========================================================== -->

<style>
    /* Chatbot Container */
    #chakorabot-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    /* Chat Button */
    #chakorabot-button {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        position: relative;
    }

    #chakorabot-button:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 30px rgba(102, 126, 234, 0.6);
    }

    #chakorabot-button svg {
        width: 30px;
        height: 30px;
        fill: white;
    }

    /* Notification Badge */
    #chakorabot-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #ef4444;
        color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        font-size: 12px;
        font-weight: bold;
        display: none;
        align-items: center;
        justify-content: center;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    /* Chat Window */
    #chakorabot-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 380px;
        height: 550px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        display: none;
        flex-direction: column;
        overflow: hidden;
        animation: slideUp 0.3s ease;
    }

    #chakorabot-window.open {
        display: flex;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Chat Header */
    #chakorabot-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    #chakorabot-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    #chakorabot-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }

    #chakorabot-title {
        font-weight: 700;
        font-size: 1.1rem;
    }

    #chakorabot-status {
        font-size: 0.8rem;
        opacity: 0.9;
    }

    #chakorabot-close {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    #chakorabot-close:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: rotate(90deg);
    }

    /* Chat Messages */
    #chakorabot-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f8f9fa;
    }

    .chakorabot-message {
        margin-bottom: 15px;
        display: flex;
        gap: 10px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .chakorabot-message.user {
        flex-direction: row-reverse;
    }

    .chakorabot-message-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 14px;
        flex-shrink: 0;
    }

    .chakorabot-message.user .chakorabot-message-avatar {
        background: #e5e7eb;
        color: #333;
    }

    .chakorabot-message-content {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 15px;
        background: white;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        word-wrap: break-word;
    }

    .chakorabot-message.user .chakorabot-message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    .chakorabot-message-time {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 5px;
    }

    /* Typing Indicator */
    .chakorabot-typing {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: white;
        border-radius: 15px;
        width: fit-content;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .chakorabot-typing.show {
        display: flex;
    }

    .chakorabot-typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #667eea;
        animation: typing 1.4s infinite;
    }

    .chakorabot-typing-dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .chakorabot-typing-dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-10px); }
    }

    /* Chat Input */
    #chakorabot-input-container {
        padding: 15px;
        background: white;
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 10px;
    }

    #chakorabot-input {
        flex: 1;
        border: 2px solid #e5e7eb;
        border-radius: 25px;
        padding: 12px 20px;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.3s ease;
    }

    #chakorabot-input:focus {
        border-color: #667eea;
    }

    #chakorabot-send {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        flex-shrink: 0;
    }

    #chakorabot-send:hover {
        transform: scale(1.1);
    }

    #chakorabot-send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Quick Actions */
    #chakorabot-quick-actions {
        display: flex;
        gap: 8px;
        padding: 0 20px 10px;
        flex-wrap: wrap;
    }

    .chakorabot-quick-action {
        background: white;
        border: 2px solid #e5e7eb;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .chakorabot-quick-action:hover {
        background: #667eea;
        color: white;
        border-color: #667eea;
    }

    /* Header Call Button */
    #chakorabot-call-header {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: all 0.3s ease;
    }

    #chakorabot-call-header:hover {
        background: rgba(255, 255, 255, 0.35);
        transform: scale(1.1);
        color: white;
    }

    /* Call Support Quick Action */
    .chakorabot-quick-action.chakorabot-call-action {
        background: #f0fdf4;
        border-color: #86efac;
        color: #15803d;
        font-weight: 600;
    }

    .chakorabot-quick-action.chakorabot-call-action:hover {
        background: #16a34a;
        border-color: #16a34a;
        color: white;
    }

    /* Call Card in Message */
    .chakorabot-call-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        overflow: hidden;
        margin-top: 4px;
    }

    .chakorabot-call-card-header {
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        padding: 8px 12px;
        border-bottom: 1px solid #e2e8f0;
    }

    .chakorabot-call-badge {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #16a34a;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .chakorabot-call-card-body {
        padding: 12px;
        text-align: center;
    }

    .chakorabot-phone-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
        color: white !important;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.3px;
        box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        transition: all 0.25s ease;
        margin: 6px 0 10px 0;
        width: 100%;
        max-width: 240px;
    }

    .chakorabot-phone-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(22, 163, 74, 0.4);
        color: white !important;
        text-decoration: none;
    }

    .chakorabot-call-card-footer {
        font-size: 0.75rem;
        color: #6b7280;
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    /* Scrollbar */
    #chakorabot-messages::-webkit-scrollbar {
        width: 6px;
    }

    #chakorabot-messages::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
    }

    #chakorabot-messages::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
    }

    /* Mobile Responsive */
    @media (max-width: 480px) {
        #chakorabot-window {
            width: calc(100vw - 40px);
            height: calc(100vh - 100px);
        }
    }
</style>

<!-- Chatbot HTML -->

<script>
    // ==================== CHATBOT JAVASCRIPT ====================
    
    let chatbotOpen = false;
    let conversationId = null;
    let userId = null;

    // Initialize chatbot
    document.addEventListener('DOMContentLoaded', function() {
        // Set welcome message time
        document.getElementById('welcome-time').textContent = getCurrentTime();
        
        // Get user ID from session if logged in
        userId = getUserId();
        
        // Generate or retrieve conversation ID
        conversationId = getConversationId();
        
        // Load chat history
        loadChatHistory();
    });

    // Toggle chatbot window
    function toggleChatbot() {
        chatbotOpen = !chatbotOpen;
        const window = document.getElementById('chakorabot-window');
        const badge = document.getElementById('chakorabot-badge');
        
        if (chatbotOpen) {
            window.classList.add('open');
            badge.style.display = 'none';
            scrollToBottom();
        } else {
            window.classList.remove('open');
        }
    }

    // ==================== IVR HELPLINE CONFIGURATION ====================
    const IVR_PHONE_NUMBER = "7314624771";
    const IVR_PHONE_DISPLAY = "+91 7314624771";
    const IVR_PHONE_TEL = "tel:+917314624771";

    function getCallSupportCardHtml() {
        return `
            <div class="chakorabot-call-card">
                <div class="chakorabot-call-card-header">
                    <span class="chakorabot-call-badge">📞 Official IVR Helpline</span>
                </div>
                <div class="chakorabot-call-card-body">
                    <p style="margin: 0 0 10px 0; font-size: 0.9rem; color: #374151; line-height: 1.5; text-align: left;">
                        You can connect directly with the ChakoraHub 24/7 automated IVR helpline for immediate assistance:
                    </p>
                    <a href="${IVR_PHONE_TEL}" class="chakorabot-phone-btn" title="Call ${IVR_PHONE_DISPLAY}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <span>${IVR_PHONE_DISPLAY}</span>
                    </a>
                    <div class="chakorabot-call-card-footer">
                        <span>📱 Tap to call on mobile</span> • <span>💻 Dial from desktop</span>
                    </div>
                </div>
            </div>
        `;
    }

    function handleCallSupportAction() {
        addMessage("📞 Call Support", "user", false);
        showTyping();
        setTimeout(() => {
            hideTyping();
            addMessage(getCallSupportCardHtml(), "bot", true);
        }, 350);
    }

    // Send message
    async function sendMessage() {
        const input = document.getElementById('chakorabot-input');
        const message = input.value.trim();
        
        if (!message) return;
        
        // Add user message to UI
        addMessage(message, 'user');
        
        // Clear input
        input.value = '';
        
        // Check if message is a call/contact/phone query
        const lowerMsg = message.toLowerCase();
        const callKeywords = ['call', 'phone', 'ivr', 'contact number', 'helpline', 'customer care', 'mobile number', 'telephone', 'talk to agent', 'speak to agent', 'contact us', 'support number', 'call support'];
        const isCallQuery = callKeywords.some(keyword => lowerMsg.includes(keyword));

        if (isCallQuery) {
            showTyping();
            setTimeout(() => {
                hideTyping();
                addMessage(getCallSupportCardHtml(), 'bot', true);
            }, 350);
            return;
        }

        // Show typing indicator
        showTyping();
        
        // Send to backend
        try {
            const response = await fetch('/api/chatbot/message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: message,
                    conversation_id: conversationId,
                    user_id: userId
                })
            });
            
            const data = await response.json();
            
            // Hide typing indicator
            hideTyping();
            
            if (data.success) {
                // Add bot response to UI
                addMessage(data.response, 'bot');
                
                // Update conversation ID
                if (data.conversation_id) {
                    conversationId = data.conversation_id;
                    saveConversationId(conversationId);
                }
            } else {
                const fallbackError = 'Sorry, I encountered an error. Please try again.';
                addMessage(data.response || data.message || fallbackError, 'bot');
            }
        } catch (error) {
            console.error('Chatbot error:', error);
            hideTyping();
            addMessage('Sorry, I\'m having trouble connecting. Please try again later.', 'bot');
        }
    }

    // Send quick message
    function sendQuickMessage(message) {
        document.getElementById('chakorabot-input').value = message;
        sendMessage();
    }

    // Handle Enter key
    function handleEnter(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // Add message to chat
    function addMessage(text, sender, isHtml = false) {
        const messagesContainer = document.getElementById('chakorabot-messages');
        
        const messageDiv = document.createElement('div');
        messageDiv.className = `chakorabot-message ${sender}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'chakorabot-message-avatar';
        avatar.textContent = sender === 'bot' ? '🤖' : '👤';
        
        const contentWrapper = document.createElement('div');
        
        const content = document.createElement('div');
        content.className = 'chakorabot-message-content';
        if (isHtml) {
            content.innerHTML = text;
        } else {
            content.textContent = text;
        }
        
        const time = document.createElement('div');
        time.className = 'chakorabot-message-time';
        time.textContent = getCurrentTime();
        
        contentWrapper.appendChild(content);
        contentWrapper.appendChild(time);
        
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(contentWrapper);
        
        messagesContainer.appendChild(messageDiv);
        
        scrollToBottom();
    }

    // Show typing indicator
    function showTyping() {
        document.getElementById('chakorabot-typing').classList.add('show');
        scrollToBottom();
    }

    // Hide typing indicator
    function hideTyping() {
        document.getElementById('chakorabot-typing').classList.remove('show');
    }

    // Scroll to bottom
    function scrollToBottom() {
        const messagesContainer = document.getElementById('chakorabot-messages');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Get current time
    function getCurrentTime() {
        const now = new Date();
        return now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    // Get user ID (from session or cookie)
    function getUserId() {
        // Try to get from global variable set by backend
        if (typeof currentUserId !== 'undefined') {
            return currentUserId;
        }
        
        // Generate anonymous ID
        let anonymousId = localStorage.getItem('chakorabot_user_id');
        if (!anonymousId) {
            anonymousId = 'anon_' + Math.random().toString(36).substring(7);
            localStorage.setItem('chakorabot_user_id', anonymousId);
        }
        return anonymousId;
    }

    // Get conversation ID
    function getConversationId() {
        let convId = sessionStorage.getItem('chakorabot_conversation_id');
        if (!convId) {
            convId = 'conv_' + Date.now() + '_' + Math.random().toString(36).substring(7);
            sessionStorage.setItem('chakorabot_conversation_id', convId);
        }
        return convId;
    }

    // Save conversation ID
    function saveConversationId(id) {
        sessionStorage.setItem('chakorabot_conversation_id', id);
    }

    // Load chat history
    async function loadChatHistory() {
        try {
            const response = await fetch(`/api/chatbot/history?conversation_id=${conversationId}`);
            const data = await response.json();
            
            if (data.success && data.messages && data.messages.length > 0) {
                // Clear welcome message
                const messagesContainer = document.getElementById('chakorabot-messages');
                messagesContainer.innerHTML = '';
                
                // Add historical messages
                data.messages.forEach(msg => {
                    addMessage(msg.content, msg.role);
                });
            }
        } catch (error) {
            console.log('No chat history to load');
        }
    }
