<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Calendar | ChakoraHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:#333;
}

/* HEADER */
.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
}

.logo img { height:60px; }

.profile-pic {
    width:42px;
    height:42px;
    border-radius:50%;
    border:2px solid white;
}

/* TITLE */
.page-title {
    text-align:center;
    color:white;
    font-weight:700;
    margin:20px 0;
}

/* NAV BUTTONS */
.nav-buttons {
    text-align:center;
    margin-bottom:20px;
}
.nav-buttons button {
    margin:5px;
}

/* MAIN CARD */
.calendar-card {
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
}

/* CALENDAR */
.calendar {
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
}

.day {
    text-align:center;
    font-weight:600;
    padding:10px;
    background:#6366f1;
    color:white;
    border-radius:8px;
}

.date {
    background:#eef2ff;
    border-radius:10px;
    padding:8px;
    min-height:110px;
    cursor:pointer;
    transition:0.3s;
}

.date:hover {
    transform:scale(1.05);
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.date-number {
    font-weight:700;
}

/* FESTIVAL */
.festival-day {
    background:#ffe082 !important;
}

/* BOOKINGS */
.booking-info {
    font-size:10px;
    padding:2px 6px;
    border-radius:20px;
    margin-top:3px;
}

.booked-slot {
    background:#ef4444;
    color:white;
}

/* TEAMS BADGE */
.teams-meeting {
    background:#2563eb;
    color:white;
    font-size:10px;
    padding:3px 6px;
    border-radius:6px;
    margin-top:4px;
}

/* BACK BUTTON */
.back-btn {
    margin-top:20px;
}

/* MOBILE FIX */
@media(max-width:768px){
    .calendar { gap:6px; }
    .date { min-height:90px; font-size:12px; }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">
        <a href="/"><img src="{{ url_for('static', filename='logo.png') }}"></a>
    </div>

    <div class="profile-wrapper" onclick="toggleDropdown()">
        <img class="profile-pic"
        src="{{ url_for('static', filename=session.get('profile_pic', 'profile_photo/defaultpicture.jpg')) }}">
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('settings') }}">Settings</a>
            <a onclick="openPopup('logout')">Logout</a>
        </div>
    </div>
</div>

<!-- TITLE -->
<h2 class="page-title">
    {{ ['January','February','March','April','May','June','July','August','September','October','November','December'][month-1] }} {{ year }}
</h2>

<!-- NAV -->
<div class="nav-buttons">
    <button class="btn btn-light" onclick="changeMonth(-1)">← Previous</button>
    <button class="btn btn-light" onclick="changeMonth(1)">Next →</button>
</div>

<!-- MAIN CARD -->
<div class="calendar-card">

    <!-- 🔥 TEAMS INTEGRATION PLACEHOLDER -->
    <div class="alert alert-info text-center">
        📅 Microsoft Teams Meetings will be displayed here (Integration Pending)
        <br>
        <small id="teamsStatus">No meetings loaded</small>
    </div>

    <div class="calendar" id="calendar"></div>

</div>

<div class="text-center">
    <a class="btn btn-dark back-btn" href="{{ url_for('resources') }}">← Back to Resources</a>
</div>

<!-- POPUP -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-content">
    <h3 id="popupMessage">Are you sure?</h3>
    <button class="btn btn-danger" onclick="confirmPopup()">Yes</button>
    <button class="btn btn-secondary" onclick="closePopup()">Cancel</button>
  </div>
</div>

<script>
const calendar = document.getElementById('calendar');
const currentMonth = {{ month - 1 }};
const currentYear = {{ year }};
const calendarData = {{ calendar_data | tojson }};

/* 🔥 FUTURE: Teams Meetings Data */
let teamsMeetings = {}; // <-- will come from API

function renderCalendar(month, year) {

  calendar.innerHTML='';

  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  days.forEach(d=>{
    const div=document.createElement('div');
    div.className='day';
    div.textContent=d;
    calendar.appendChild(div);
  });

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    calendar.appendChild(document.createElement('div'));
  }

  for(let date=1;date<=daysInMonth;date++){

    const div=document.createElement('div');
    div.className='date';

    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`;

    div.innerHTML=`<strong class="date-number">${date}</strong>`;

    /* EXISTING DATA */
    if(calendarData[key]){
        if(calendarData[key].festival){
            div.classList.add('festival-day');
        }
    }

    /* 🔥 TEAMS INTEGRATION (DO NOT REMOVE) */
    if(teamsMeetings[key]){
        const meet=document.createElement('div');
        meet.className='teams-meeting';
        meet.innerText='Teams Meeting';
        div.appendChild(meet);
    }

    calendar.appendChild(div);
  }
}

function changeMonth(dir){
    let m=currentMonth+dir;
    let y=currentYear;
    if(m>11){m=0;y++}
    if(m<0){m=11;y--}
    window.location.href=`/calendar?month=${m+1}&year=${y}`;
}

document.addEventListener("DOMContentLoaded", ()=>{
    renderCalendar(currentMonth,currentYear);
});
</script>

</body>
</html>
