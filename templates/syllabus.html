<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Syllabus - ChakoraHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

<style>
  body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #1f2937;
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }

  .header .logo img {
    height: 65px;
  }

  .profile-wrapper {
    position: relative;
    cursor: pointer;
  }

  .profile-pic {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid white;
    object-fit: cover;
    transition: transform 0.2s;
  }

  .profile-pic:hover {
    transform: scale(1.08);
  }

  .dropdown-menu {
    display: none;
    position: absolute;
    top: 60px;
    right: 0;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    min-width: 180px;
    overflow: hidden;
  }

  .dropdown-menu a {
    display: block;
    padding: 12px 16px;
    text-decoration: none;
    color: #333;
    font-weight: 500;
  }

  .dropdown-menu a:hover {
    background: #f3f4f6;
  }

  /* SIDEBAR */
  .sidebar {
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(10px);
    color: #fff;
    padding-top: 20px;
    border-right: 1px solid rgba(255,255,255,0.1);
  }

  .sidebar h4 {
    padding-left: 20px;
    margin-bottom: 20px;
    font-weight: 600;
  }

  .sidebar a {
    display: block;
    padding: 10px 20px;
    color: #e5e7eb;
    text-decoration: none;
    transition: all 0.2s;
    border-left: 3px solid transparent;
  }

  .sidebar a:hover {
    background: rgba(255,255,255,0.1);
    border-left: 3px solid #6366f1;
    padding-left: 24px;
  }

  /* CONTENT */
  .content {
    margin-left: 250px;
    padding: 40px 30px;
  }

  .syllabus-box {
    background: white;
    border-radius: 16px;
    padding: 20px;
    max-height: 650px;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }

  h2 {
    font-weight: 700;
    margin-bottom: 15px;
  }

  /* ADMIN BUTTON */
  .admin-controls button {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    color: white;
    font-weight: 600;
    transition: all 0.2s;
  }

  .admin-controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(239,68,68,0.4);
  }

  /* BACK BUTTON */
  .back-button button {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    padding: 12px 26px;
    border-radius: 10px;
    border: none;
    color: white;
    font-weight: 600;
    transition: all 0.2s;
  }

  .back-button button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79,70,229,0.3);
  }

  /* MODAL */
  .modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.7);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .modal-content h3 {
    margin-bottom: 20px;
    font-weight: 600;
  }

  .confirm-btn {
    background: #4f46e5;
    color: white;
  }

  .cancel-btn {
    background: #e5e7eb;
  }

  .modal-actions button {
    margin: 10px;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-weight: 600;
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
    }

    .content {
      margin-left: 0;
    }
  }
</style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
    </div>
    <div class="profile-wrapper" onclick="toggleDropdown()">
      <img class="profile-pic" src="{{ url_for('static', filename=session.get('profile_pic', 'profile_photo/defaultpicture.jpg')) }}" alt="Profile" />
      <div class="dropdown-menu" id="dropdownMenu">
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('settings') }}">Settings</a>
        <a href="#" onclick="openModal('logout')">Logout</a>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4>Courses</h4>
    {% for course in courses %}
      <a href="#" onclick="loadSyllabus({{ course.ID }}); return false;">{{ course.COURSE_NAME }}</a>
    {% endfor %}
    {% if session.get('role') == 'admin' %}
      <a href="{{ url_for('upload_page') }}" class="btn btn-success m-3">Upload New Syllabus</a>
    {% endif %}
  </div>

  <!-- Content -->
  <div class="content">
    <div id="syllabusContent">
      <h2>Welcome!</h2>
      <p>Select a course from the sidebar to view its syllabus.</p>
    </div>
    <div class="back-button">
      <button onclick="window.location.href='{{ url_for('resources') }}'">⬅ Back to Resources</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="confirmationModal" class="modal">
    <div class="modal-content">
      <h3 id="modalMessage">Are you sure?</h3>
      <div class="modal-actions">
        <button class="confirm-btn" id="confirmBtn">Yes</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdownMenu');
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function(event) {
      const dropdown = document.getElementById('dropdownMenu');
      const wrapper = document.querySelector('.profile-wrapper');
      if (!wrapper.contains(event.target)) {
        dropdown.style.display = 'none';
      }
    });

    let actionType = null;
    function openModal(type, courseId=null) {
      actionType = {type, courseId};
      const modal = document.getElementById('confirmationModal');
      const message = document.getElementById('modalMessage');
      if (type === 'logout') {
        message.textContent = "Are you sure you want to log out?";
      } else if (type === 'delete') {
        message.textContent = "Are you sure you want to delete this syllabus?";
      }
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('confirmationModal').style.display = 'none';
    }

    document.getElementById('confirmBtn').addEventListener('click', function() {
      if (actionType.type === 'logout') {
        window.location.href = "{{ url_for('logout') }}";
      } else if (actionType.type === 'delete') {
        deleteSyllabus(actionType.courseId, true);
      }
      closeModal();
    });

    function loadSyllabus(courseId) {
      fetch(`/syllabus/${courseId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Syllabus not found');
          }
          return response.json();
        })
        .then(data => {
          const syllabusDiv = document.getElementById('syllabusContent');
          if (data.pdf_url) {
            syllabusDiv.innerHTML = `
              <h2>${data.course_name} - Syllabus</h2>
              <div class="syllabus-box">
                <p><strong>Duration:</strong> ${data.duration || 'Not specified'}</p>
                <p><strong>Content:</strong> ${data.content || 'No details available'}</p>
                <embed src="${data.pdf_url}" width="100%" height="600px" type="application/pdf" />
              </div>
              ${data.is_admin ? `
              <div class="admin-controls">
                <button onclick="openModal('delete', ${courseId})">Delete Syllabus</button>
              </div>` : ''}
            `;
          } else {
            syllabusDiv.innerHTML = `<p>No syllabus uploaded for this course yet.</p>`;
          }
        })
        .catch((error) => {
          document.getElementById('syllabusContent').innerHTML = `<p>${error.message}</p>`;
        });
    }

    function deleteSyllabus(courseId, confirmed=false) {
      if (!confirmed) {
        openModal('delete', courseId);
        return;
      }
      fetch(`/syllabus/delete/${courseId}`, { method: "POST" })
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            alert("Syllabus deleted successfully.");
            document.getElementById('syllabusContent').innerHTML = `<p>Syllabus deleted. Please refresh or select another course.</p>`;
          } else {
            alert("Failed to delete syllabus.");
          }
        })
        .catch(() => { alert("Error while deleting."); });
    }
  </script>
</body>
</html>
