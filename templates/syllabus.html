<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Syllabus - ChakoraHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e1f5fe, #ede7f6);
      color: #333;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 30px;
      background: linear-gradient(to right, #42a5f5, #7e57c2);
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    }

    .header .logo img {
      height: 80px;
    }

    .profile-wrapper {
      position: relative;
      cursor: pointer;
    }

    .profile-pic {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid white;
      object-fit: cover;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 55px;
      right: 0;
      background-color: white;
      color: black;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 1000;
      min-width: 160px;
    }

    .dropdown-menu a {
      display: block;
      padding: 10px 15px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
      border-bottom: 1px solid #eee;
    }

    .dropdown-menu a:last-child {
      border-bottom: none;
    }

    .dropdown-menu a:hover {
      background-color: #f0f0f0;
    }

    /* Sidebar */
    .sidebar {
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      width: 220px;
      background: #343a40;
      color: #fff;
      overflow-y: auto;
      padding-top: 20px;
    }

    .sidebar h4 {
      font-size: 18px;
      margin-top: 10px;
      padding-left: 15px;
    }

    .sidebar a {
      display: block;
      color: #fff;
      padding: 8px 15px;
      text-decoration: none;
    }

    .sidebar a:hover {
      background: #495057;
    }

    /* Content */
    .content {
      margin-left: 230px;
      padding: 20px;
      padding-top: 40px;
    }

    .syllabus-box {
      background: #ffffff;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 15px;
      max-height: 600px;
      overflow-y: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .admin-controls {
      margin-top: 15px;
      display: flex;
      justify-content: flex-end;
    }

    .admin-controls button {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-controls button:hover {
      background-color: #b52a37;
    }

    .back-button {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    .back-button button {
      background: #3949ab;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-button button:hover {
      background: #303f9f;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      width: 320px;
    }

    .modal-content h3 {
      margin-bottom: 20px;
      color: #3949ab;
    }

    .modal-actions button {
      margin: 8px;
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .confirm-btn {
      background: #3949ab;
      color: white;
    }

    .cancel-btn {
      background: #f0f0f0;
      color: #333;
    }

    .confirm-btn:hover {
      background: #303f9f;
    }

    .cancel-btn:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" />
    </div>
    <div class="profile-wrapper" onclick="toggleDropdown()">
      <img class="profile-pic" src="{{ url_for('static', filename=session.get('profile_pic', 'profile_photo/defaultpicture.jpg')) }}" alt="Profile" />
      <div class="dropdown-menu" id="dropdownMenu">
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('settings') }}">Settings</a>
        <a href="#" onclick="openModal('logout')">Logout</a>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4>Courses</h4>
    {% for course in courses %}
      <a href="#" onclick="loadSyllabus({{ course.ID }}); return false;">{{ course.COURSE_NAME }}</a>
    {% endfor %}
    {% if session.get('role') == 'admin' %}
      <a href="{{ url_for('upload_page') }}" class="btn btn-success m-3">Upload New Syllabus</a>
    {% endif %}
  </div>

  <!-- Content -->
  <div class="content">
    <div id="syllabusContent">
      <h2>Welcome!</h2>
      <p>Select a course from the sidebar to view its syllabus.</p>
    </div>
    <div class="back-button">
      <button onclick="window.location.href='{{ url_for('resources') }}'">⬅ Back to Resources</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="confirmationModal" class="modal">
    <div class="modal-content">
      <h3 id="modalMessage">Are you sure?</h3>
      <div class="modal-actions">
        <button class="confirm-btn" id="confirmBtn">Yes</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdownMenu');
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function(event) {
      const dropdown = document.getElementById('dropdownMenu');
      const wrapper = document.querySelector('.profile-wrapper');
      if (!wrapper.contains(event.target)) {
        dropdown.style.display = 'none';
      }
    });

    let actionType = null;
    function openModal(type, courseId=null) {
      actionType = {type, courseId};
      const modal = document.getElementById('confirmationModal');
      const message = document.getElementById('modalMessage');
      if (type === 'logout') {
        message.textContent = "Are you sure you want to log out?";
      } else if (type === 'delete') {
        message.textContent = "Are you sure you want to delete this syllabus?";
      }
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('confirmationModal').style.display = 'none';
    }

    document.getElementById('confirmBtn').addEventListener('click', function() {
      if (actionType.type === 'logout') {
        window.location.href = "{{ url_for('logout') }}";
      } else if (actionType.type === 'delete') {
        deleteSyllabus(actionType.courseId, true);
      }
      closeModal();
    });

    function loadSyllabus(courseId) {
      fetch(`/syllabus/${courseId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Syllabus not found');
          }
          return response.json();
        })
        .then(data => {
          const syllabusDiv = document.getElementById('syllabusContent');
          if (data.pdf_url) {
            syllabusDiv.innerHTML = `
              <h2>${data.course_name} - Syllabus</h2>
              <div class="syllabus-box">
                <p><strong>Duration:</strong> ${data.duration || 'Not specified'}</p>
                <p><strong>Content:</strong> ${data.content || 'No details available'}</p>
                <embed src="${data.pdf_url}" width="100%" height="600px" type="application/pdf" />
              </div>
              ${data.is_admin ? `
              <div class="admin-controls">
                <button onclick="openModal('delete', ${courseId})">Delete Syllabus</button>
              </div>` : ''}
            `;
          } else {
            syllabusDiv.innerHTML = `<p>No syllabus uploaded for this course yet.</p>`;
          }
        })
        .catch((error) => {
          document.getElementById('syllabusContent').innerHTML = `<p>${error.message}</p>`;
        });
    }

    function deleteSyllabus(courseId, confirmed=false) {
      if (!confirmed) {
        openModal('delete', courseId);
        return;
      }
      fetch(`/syllabus/delete/${courseId}`, { method: "POST" })
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            alert("Syllabus deleted successfully.");
            document.getElementById('syllabusContent').innerHTML = `<p>Syllabus deleted. Please refresh or select another course.</p>`;
          } else {
            alert("Failed to delete syllabus.");
          }
        })
        .catch(() => { alert("Error while deleting."); });
    }
  </script>
</body>
</html>
