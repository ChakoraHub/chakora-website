<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<style>
body{
margin:0;
background:linear-gradient(120deg,#eef6fa,#ffffff);
font-family:Arial;
}

.auth-container{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.auth-box{
background:#fff;
width:360px;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.auth-box h3{
text-align:center;
margin-bottom:20px;
color:#0078D7;
}

.auth-box select,
.auth-box input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

.auth-box button{
width:100%;
margin-top:20px;
padding:12px;
background:#0078D7;
border:none;
border-radius:6px;
color:white;
font-size:15px;
cursor:pointer;
}

.auth-box button:hover{
background:#005a9e;
}

.note{
text-align:center;
margin-top:10px;
font-size:13px;
color:#666;
}
</style>

</head>

<body>

<div class="auth-container">

<div class="auth-box">

<h3>Forgot Password</h3>

<form method="POST">

<select name="type" required>
<option value="">Select Account Type</option>
<option value="user">User / Student</option>
<option value="employee">Employee</option>
</select>

<input name="username" placeholder="Registered Email" required>

<button>Send Reset Link</button>

</form>

<div class="note">
Reset link valid for 30 minutes
</div>

</div>
</div>

</body>
</html>
